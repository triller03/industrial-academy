services:
  api:
    build: .
    image: industrial-academy:latest
    container_name: industrial-academy
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:////app/data/academy.db
      - MODBUS_PORT=1502
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./data/offline_packages:/app/backend/offline_packages
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    read_only: false